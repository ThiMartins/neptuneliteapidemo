apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.Mercadinho"
        minSdkVersion 14
        targetSdkVersion 29
        versionCode 42
        versionName "V3.30.00_20220720"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file('key/com.pax.innov.apk.sign')
            storePassword 'com.pax.innov.apk.sign'
            keyAlias 'com.pax.innov.apk.sign'
            keyPassword 'com.pax.innov.apk.sign'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}

import org.gradle.api.tasks.Exec
import org.gradle.api.GradleException

gradle.projectsEvaluated {
    tasks.register("deployToPAX930") {
        group = "deployment"
        description = "Instala automaticamente o APK na PAX930 via USB"

        doLast {
            // 🔍 Localiza o SDK automaticamente
            def sdkDir = android.getSdkDirectory().absolutePath
            def adbPath = "${sdkDir}/platform-tools/adb"
            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                adbPath += ".exe"
            }

            // 🔍 Caminho do APK (ajuste se for outro variant)
            def apkPath = "${buildDir}/outputs/apk/debug/app-debug.apk"

            println "==> SDK detectado: ${sdkDir}"
            println "==> ADB detectado: ${adbPath}"
            println "==> APK alvo: ${apkPath}"

            if (!file(adbPath).exists()) {
                throw new GradleException("❌ ADB não encontrado em: ${adbPath}")
            }
            if (!file(apkPath).exists()) {
                throw new GradleException("❌ APK não encontrado em: ${apkPath}")
            }

            println "==> Verificando dispositivos conectados..."
            exec {
                commandLine adbPath, "devices"
            }

            println "==> Instalando APK na PAX930..."
            def result = exec {
                commandLine adbPath, "install", "-r", apkPath
                ignoreExitValue = true
            }

            if (result.exitValue != 0) {
                throw new GradleException("❌ Falha ao instalar o APK na PAX930 (erro ${result.exitValue}). Verifique conexão USB e modo de depuração.")
            }

            println "✅ APK instalado com sucesso na PAX930!"
        }
    }

    // Faz o deploy automaticamente após o build
    tasks.named("assembleDebug").configure {
        finalizedBy("deployToPAX930")
    }
}